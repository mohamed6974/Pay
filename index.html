<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Interactive Cyber Background</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
background:#02050a;
font-family:Arial;
}

canvas{
position:fixed;
inset:0;
}

.overlay{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
pointer-events:none;
}

h1{
font-size:90px;
color:#00f0ff;
text-shadow:
0 0 20px #00f0ff,
0 0 60px #00f0ff;
}

p{
color:white;
letter-spacing:5px;
}

</style>
</head>

<body>

<canvas id="scene"></canvas>

<div class="overlay">
<h1>M.X6</h1>
<p>CYBER PRESENTATION</p>
</div>

<script>

const canvas =
document.getElementById("scene");

const ctx =
canvas.getContext("2d");

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

const mouse = {

x:innerWidth/2,
y:innerHeight/2,
down:false

};

document.addEventListener(
"mousemove",
e=>{

mouse.x=e.clientX;
mouse.y=e.clientY;

}
);

document.addEventListener(
"mousedown",
()=>{

mouse.down=true;

createShockwave(
mouse.x,
mouse.y
);

}
);

document.addEventListener(
"mouseup",
()=>{

mouse.down=false;

}
);

class Particle{

constructor(){

this.reset();

}

reset(){

this.x=
Math.random()*
canvas.width;

this.y=
Math.random()*
canvas.height;

this.vx=
(Math.random()-.5);

this.vy=
(Math.random()-.5);

this.size=
Math.random()*3+1;

}

update(){

const dx=
mouse.x-this.x;

const dy=
mouse.y-this.y;

const dist=
Math.sqrt(
dx*dx+dy*dy
);

if(dist<180){

this.x += dx*0.01;
this.y += dy*0.01;

}

this.x+=this.vx;
this.y+=this.vy;

if(this.x<0||
this.x>canvas.width)
this.vx*=-1;

if(this.y<0||
this.y>canvas.height)
this.vy*=-1;

}

draw(){

ctx.beginPath();

ctx.arc(
this.x,
this.y,
this.size,
0,
Math.PI*2
);

ctx.fillStyle=
"#00f0ff";

ctx.fill();

}

}

const particles=[];

for(let i=0;i<180;i++){

particles.push(
new Particle()
);

}

const waves=[];

function createShockwave(x,y){

waves.push({

x,
y,
radius:0,
alpha:1

});

}

function drawWaves(){

for(let i=waves.length-1;i>=0;i--){

let w=waves[i];

ctx.beginPath();

ctx.arc(
w.x,
w.y,
w.radius,
0,
Math.PI*2
);

ctx.strokeStyle=
`rgba(
0,
240,
255,
${w.alpha}
)`;

ctx.lineWidth=3;

ctx.stroke();

w.radius+=8;
w.alpha-=0.015;

if(w.alpha<=0){

waves.splice(i,1);

}

}

}

let cameraX=0;
let cameraY=0;

function animate(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

cameraX +=
(
(mouse.x-canvas.width/2)
*0.01
-cameraX
)*0.05;

cameraY +=
(
(mouse.y-canvas.height/2)
*0.01
-cameraY
)*0.05;

ctx.save();

ctx.translate(
cameraX,
cameraY
);

for(let p of particles){

p.update();
p.draw();

}

for(let a=0;a<particles.length;a++){

for(let b=a+1;b<particles.length;b++){

let dx=
particles[a].x-
particles[b].x;

let dy=
particles[a].y-
particles[b].y;

let dist=
Math.sqrt(
dx*dx+dy*dy
);

if(dist<120){

ctx.beginPath();

ctx.moveTo(
particles[a].x,
particles[a].y
);

ctx.lineTo(
particles[b].x,
particles[b].y
);

ctx.strokeStyle=
`rgba(
0,
240,
255,
${1-dist/120}
)`;

ctx.lineWidth=.3;

ctx.stroke();

}

}

}

ctx.restore();

drawWaves();

requestAnimationFrame(
animate
);

}

animate();

</script>

</body>
</html>
